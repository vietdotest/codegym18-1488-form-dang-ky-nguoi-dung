<head>

<body >
<h1>Đăng ký người dùng</h1><form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST"><label class="field" for="name">Họ và tên</label><input id="name" type="text" name="name" required><label class="field" for="email">Email</label><input id="email" type="email" name="email" required><label class="field" for="phone">Số điện thoại</label><input id="phone" type="tel" name="phone" required><fieldset><legend>Giới tính</legend><div class="choices"><label><input type="radio" name="gender" value="Nam">Nam</label><label><input type="radio" name="gender" value="Nữ">Nữ</label></div></fieldset><button type="submit">Đăng ký</button></form>
</body>
